<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<link
			rel="stylesheet"
			href="/css/bootstrap.css"
		/>
		<link
			rel="stylesheet"
			href="/css/custom.css"
		/>
		<title>Search For Movies</title>
	</head>
	<body>
		<main class="container">
			<header class="mt-2">
				<h2>Search movies</h2>
				<hr />
			</header>
			<form>
				<div class="mt-3">
					<label
						for="search-title"
						class="form-label"
					>
						Search by title:
					</label>
					<!-- input:text#search-title -->
					<input
						type="text"
						name="search-title"
						id="search-title"
						class="form-control"
					/>

					<div class="mt-2">
						<button
							type="button"
							id="search-button"
							class="btn btn-primary"
						>
							Search
						</button>
					</div>
				</div>
			</form>
			<div class="row">
				<div class="col">
					<p id="search-message">You searched on ...</p>
					<p>Results will appear here.</p>
					<div class="grid-container">
						<div class="grid-row grid-header-row">
							<div class="grid-cell">Title</div>
							<div class="grid-cell">Year</div>
							<div class="grid-cell">Rating</div>
						</div>
						<div class="grid-body"></div>
						<!-- (.grid-row>.grid-cell*3>{Item $})*3 -->
						<!-- 
						<div class="grid-row">
							<div class="grid-cell">Item 1</div>
							<div class="grid-cell">Item 2</div>
							<div class="grid-cell">Item 3</div>
						</div> 
						-->
					</div>
				</div>
			</div>
		</main>
		<script
			type="module"
			src="src/search-movies-live.js"
		></script>
	</body>
</html>
